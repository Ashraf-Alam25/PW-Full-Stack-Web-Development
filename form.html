<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>user details</legend>
            <label for="name">Enter your name: </label>
            <input type="text" name="username" id="name"/>
            <br/>
            <label for="address">Enter your address:</label>
            <textarea name="useraddress" id="address" rows="10" cols="15"></textarea>

            <br/>
            <label for="dob">DOB</label>
            <input type="date" id="dob" name="userdob"/>

            <br/>
            <label for="pass">Enter your password</label>
            <input type="password" name="userpassword" id="pass">
            <br/>
            select gender: <br>
            <label for="male">male</label>
            <input type="radio" id="male" name="gender"/>
            <br>
            <label for="female">female</label>
            <input type="radio" id="female" name="gender"/>
            <br>

            select favorate movie: <br>
            <label for="avengers">avengers</label>
            <input type="checkbox" name="avengers" id="avenger">
            <br>
            <label for="thor">thor</label>
            <input type="checkbox" name="thor" id="thor">
            <br>
            <label for="tonystark">tony stark</label>
            <input type="checkbox" name="tonystark" id="tonystark">

            <br>
            <input type="submit">
        </fieldset>
        
    </form>
</body>
</html>
