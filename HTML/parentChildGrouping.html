<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parent child shortcut grouping</title>
</head>
<body>
    <!-- parent child -->
    <!-- div>p>ul>li then enter maaro  this is shortcut-->
    <div>
        <p>
            <ul>
                <li>how are uou</li>
            </ul>
        </p>
    </div>

    <!-- mujhe 5 list chahiye to div>p>ul>li*5 -->
    <div>
        <p>
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </p>
    </div>

    <!-- brotherhood / sibling  -->
    <!-- div>p+p+p -->
    <div>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </div>

    <!-- grouping -->
    <!-- div>(nav>li*5)+section -->
    <div>
        <nav>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </nav>
        <section></section>
    </div>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Laboriosam officia, corrupti, cum, at sequi itaque necessitatibus alias nisi ut repudiandae temporibus in ullam facere velit!</p>
</body>
</html>
